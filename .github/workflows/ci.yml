# Verificación en cada push y PR: tipos, pruebas (incluidas las contables contra
# PostgreSQL en memoria con PGlite) y build de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
