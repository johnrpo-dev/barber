# /etc/systemd/system/caddy.service.d/villa.conf (lo instala deploy/scripts/install-kit.sh).
# Carpeta para el socket de administración de Caddy (admin unix//run/caddy/admin.sock|0600): el
# usuario caddy no puede crear archivos directamente en /run. systemd la crea al arrancar.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
